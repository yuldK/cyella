<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>diff viewer harness</title>
    <style>
        body { margin: 0; font: 12px/1.4 "Segoe UI", sans-serif; background: #111; color: #ddd; }
        #bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: #222; }
        #bar button { padding: 3px 8px; }
        #frame { display: block; width: 100%; height: calc(100vh - 140px); border: 0; }
        #log { height: 96px; margin: 0; padding: 4px 8px; overflow: auto; background: #181818; font: 11px/1.3 Consolas, monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <!--
        assets/diff-viewer를 브라우저에서 단독으로 확인하는 점검 틀이다. window.chrome.webview를 흉내 내
        C++ 메시지를 직접 넣고 뷰어가 보내는 메시지를 아래에 찍는다. 저장소 루트를 정적 서버로 연다.
            py -m http.server 8791 --directory <저장소 루트>
            http://localhost:8791/tests/manual/diff_viewer_harness/index.html
    -->
    <div id="bar"></div>
    <iframe id="frame" title="viewer"></iframe>
    <pre id="log"></pre>
    <script src="harness.js"></script>
</body>
</html>
